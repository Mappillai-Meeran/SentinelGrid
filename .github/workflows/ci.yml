name: SentinelGrid CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test SentinelGrid Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven and Run Unit/Integration Tests
        run: mvn clean package -B

      - name: Upload Application JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinelgrid-backend-jar
          path: target/sentinelgrid-*.jar
          retention-days: 7
