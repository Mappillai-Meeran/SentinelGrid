version: '3.8'

# Local development override for SentinelGrid Docker Compose.
# Provides default credentials and secrets for local multi-container development only.
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up
services:
  app:
    environment:
      - SPRING_PROFILES_ACTIVE=local,docker
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set for local Docker development}"
      - SPRING_DATASOURCE_USERNAME=sentinel_user
      - "SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set for local Docker development}"
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=sentinelgrid
      - POSTGRES_USER=sentinel_user
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for local Docker development}"

