<svg width="400" height="280" viewBox="0 0 400 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="400" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="150" y1="40" x2="250" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Background Glow Circle -->
  <circle cx="200" cy="140" r="120" fill="url(#blueGrad)" />

  <!-- Grid Pattern Lines -->
  <path d="M100 80 L300 80 M100 140 L300 140 M100 200 L300 200" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 4" />
  <path d="M140 50 L140 230 M200 50 L200 230 M260 50 L260 230" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Network Nodes -->
  <circle cx="140" cy="80" r="6" fill="#60A5FA" />
  <circle cx="260" cy="80" r="6" fill="#34D399" />
  <circle cx="140" cy="200" r="6" fill="#818CF8" />
  <circle cx="260" cy="200" r="6" fill="#FBBF24" />

  <!-- Connection Pulse Ring -->
  <circle cx="200" cy="140" r="85" stroke="url(#pulseGrad)" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="6 6" />

  <!-- Shield Base -->
  <path d="M200 60 C230 60 250 50 250 50 V130 C250 175 200 205 200 205 C200 205 150 175 150 130 V50 C150 50 170 60 200 60 Z" fill="url(#shieldGrad)" shadow="0 10px 25px rgba(0,0,0,0.2)"/>
  <path d="M200 65 C225 65 242 56 242 56 V128 C242 167 200 194 200 194 C200 194 158 167 158 128 V56 C158 56 175 65 200 65 Z" fill="#2563EB"/>

  <!-- Emergency Cross Icon inside Shield -->
  <path d="M190 100 H210 V120 H230 V140 H210 V160 H190 V140 H170 V120 H190 V100 Z" fill="#FFFFFF" />

  <!-- Floating Medicine Capsule Pill (Left) -->
  <g transform="translate(70, 110) rotate(-25)">
    <rect x="0" y="0" width="50" height="22" rx="11" fill="#34D399" opacity="0.9" />
    <path d="M25 0 H39 C45 0 50 5 50 11 C50 17 45 22 39 22 H25 V0 Z" fill="#FFFFFF" opacity="0.95" />
    <rect x="0" y="0" width="50" height="22" rx="11" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>

  <!-- Floating ECG Heartbeat Badge (Right) -->
  <g transform="translate(280, 120)">
    <rect x="0" y="0" width="56" height="40" rx="12" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" />
    <path d="M8 20 H18 L23 10 L29 30 L35 15 L40 20 H48" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Status Indicator Pulse Dot -->
  <circle cx="200" cy="235" r="5" fill="#34D399" />
  <circle cx="200" cy="235" r="10" fill="#34D399" fill-opacity="0.3" />
</svg>
