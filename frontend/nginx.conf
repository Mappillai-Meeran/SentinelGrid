server {
    listen 80;
    server_name localhost;

    # HTTP Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; frame-src https://maps.google.com https://www.google.com; frame-ancestors 'self'; connect-src 'self' http: https:;" always;

    # Note on HSTS (Strict-Transport-Security):
    # This Nginx server listens on plaintext port 80 inside the container.
    # Per RFC 6797, HSTS must only be emitted over verified TLS connections.
    # In production, TLS termination and HSTS enforcement occur upstream at the
    # cloud load balancer / ingress controller level.

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://sentinelgrid-app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
